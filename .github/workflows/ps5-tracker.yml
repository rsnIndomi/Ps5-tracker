name: PS5 Pro stock check

# Runs tracker.py --once on a schedule and pushes an ntfy alert when the PS5 Pro is in stock.
#
# Setup (see README.md, Option B):
#   1. Make the repository PUBLIC (standard runners are free there; in a private repo on
#      GitHub Free this schedule uses up the 2,000 included minutes in about a week, after
#      which GitHub blocks all runs until the next billing cycle, with no warning push).
#   2. Secret NTFY_TOPIC (optional: secret NTFY_TOKEN, variable NTFY_SERVER).
#   3. Variable TRACKER_ENABLED = true. Until then scheduled runs are skipped and cost nothing.
#   4. Actions > "PS5 Pro stock check" > Run workflow > "test-notify" to get a test push.
#
# GitHub runs schedules best-effort. For this repo the */5 schedule actually fired only every
# 4-7 hours, so an external timer (cron-job.org -> workflow_dispatch API, see README) starts the
# real 5-minute checks; this schedule stays as a backup. Minutes are offset from :00 because the
# start of the hour is GitHub's busiest time.

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "check = normal run | test-notify = send a test push | check-only = show what GitHub's server sees, no ntfy needed"
        type: choice
        options: [check, test-notify, check-only]
        default: check

permissions:
  contents: read

concurrency:
  group: ps5-tracker
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.TRACKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'schedule' && 'check' || inputs.action }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      NTFY_SERVER: ${{ vars.NTFY_SERVER }}
      STATE_FILE: state.json
      TZ: Europe/Amsterdam
      # One check per run, so: warn after 3 failed runs in a row.
      ERROR_ALERT_AFTER: "3"
      # Seconds. Slightly under the 5-minute schedule so the 2nd alert goes out on the next run;
      # later reminders back off (x2 each time, max 1 per hour).
      REMIND_EVERY: "240"
      # Daily "still watching" push after this hour (Amsterdam time); set the repo variable to "off" to disable.
      HEARTBEAT_HOUR: ${{ vars.HEARTBEAT_HOUR || '9' }}
    steps:
      - uses: actions/checkout@v4

      - name: Show what the tracker sees (no notifications)
        if: env.MODE == 'check-only'
        run: python3 tracker.py --check

      - name: Check configuration
        if: env.MODE != 'check-only'
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::error::Repository secret NTFY_TOPIC is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Send test notification
        if: env.MODE == 'test-notify'
        run: python3 tracker.py --test-notify

      - name: Restore tracker state
        if: env.MODE == 'check'
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-

      - name: Check stock
        if: env.MODE == 'check'
        run: python3 tracker.py --once

      - name: Save tracker state
        if: always() && env.MODE == 'check' && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: tracker-state-${{ github.run_id }}
